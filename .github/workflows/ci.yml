name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  linux-targets:
    uses: ./.github/workflows/build.yml

  # Keep the existing required check name for branch protection.
  build-and-test:
    runs-on: ubuntu-latest
    needs: linux-targets
    if: always()
    steps:
      - run: test '${{ needs.linux-targets.result }}' = success
